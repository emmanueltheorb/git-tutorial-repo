<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Citizen Reporter</title>
  </head>
  <body>
    <header id="main-header">
      <h1>Citizen Reporter</h1>
      <p>Report Incidents Near You</p>
    </header>

    <div id="view-reports-button">
      <p id="report-count">Loading</p>
      <span>Click to view</span>
    </div>

    <section id="report-section" class="hidden">
      <div id="category-row">
        <button class="chip active" data-category="0">All</button>
        <button class="chip" data-category="1">Accident</button>
        <button class="chip" data-category="2">Fighting</button>
        <button class="chip" data-category="3">Rioting</button>
        <button class="chip" data-category="4">Environment</button>
      </div>

      <div id="report-list"></div>

      <button id="go-back-button" class="button secondary">Go Back</button>
    </section>

    <section id="single-report-section" class="hidden">
      <div id="single-report-card"></div>

      <div class="single-report-actions">
        <button id="back-to-list-button" class="button">Back to List</button>
        <button id="delete-button" class="button danger">Delete</button>
      </div>
    </section>

    <button id="add-report-button">Add New Report</button>

    <section id="report-form-section" class="hidden">
      <div class="form-card">
        <form id="add-report-form">
          <h2>Add Report</h2>

          <div class="form-field">
            <label for="title">Title</label>

            <input
              type="text"
              name="title"
              id="title"
              placeholder="Incident title"
              required
            />
          </div>

          <div class="form-field">
            <label for="description">Description</label>

            <textarea
              name="description"
              id="description"
              rows="5"
              placeholder="Describe the incident"
              required
            ></textarea>
          </div>

          <div class="form-field">
            <label for="category">Category</label>

            <select name="category" id="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="accident">Accident</option>
              <option value="rioting">Rioting</option>
              <option value="fighting">Fighting</option>
              <option value="environment">Environment</option>
            </select>
          </div>

          <div class="form-field">
            <label for="location">Location</label>

            <input
              type="text"
              id="location"
              placeholder="Incident location"
              required
            />
          </div>

          <div class="form-field">
            <label for="urgency-level">Urgency Level</label>

            <select name="urgency" id="urgency-level" required>
              <option value="" disabled selected>How Urgent?</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-report-button" class="button">
              Submit
            </button>

            <button type="button" id="cancel-button" class="button secondary">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </section>
    <script src="js/app.js"></script>
  </body>
</html>
